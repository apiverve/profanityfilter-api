openapi: 3.0.4
info:
  title: Profanity Filter
  description: >-
    Profanity Filter is a bad word filter API that scans text for offensive
    language and masks detected swear words with a chosen replacement character.
    It returns the sanitized text and a boolean flag indicating if profanity was
    present. Paid plans add the count of filtered words, each matched word with
    its position, and custom allow and block word lists.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/profanityfilter:
    post:
      summary: Profanity Filter
      description: >-
        Filter out profanity words from a body of text, optionally listing each
        match and customizing the word list
      operationId: profanityfilter
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  isProfane: true
                  filteredText: Today is so **** hot! Why the **** would anyone go outside?
                  mask: '*'
                  trimmed: false
                  profaneWords: 2
                  matches:
                    - word: damn
                      start: 12
                      end: 16
                    - word: hell
                      start: 30
                      end: 34
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: The text to filter profanity words from
                mask:
                  type: string
                  description: >-
                    The mask to replace the profanity words with. Should be a
                    Single Character (e.g., *)
                details:
                  type: boolean
                  description: >-
                    Add a matches list with each filtered word and its start and
                    end position
                allow:
                  type: string
                  description: >-
                    Comma-separated words the filter should not flag, up to 100
                    single words (e.g. hell,damn)
                add:
                  type: string
                  description: >-
                    Comma-separated extra words to flag and mask, up to 100
                    single words
              required:
                - text
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
sampleRequest:
  text: Today is so damn hot! Why the hell would anyone go outside?
  mask: '*'
  details: true
